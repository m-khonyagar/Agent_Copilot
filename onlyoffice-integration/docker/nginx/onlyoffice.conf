# ─────────────────────────────────────────────────────────────────────────────
# Nginx reverse-proxy config for ONLYOFFICE Document Server
#
# Place this file in your Nginx sites-enabled directory, or merge the relevant
# location blocks into your existing amline.conf / default.conf.
#
# Assumptions:
#   • Nginx is running on the host (or in an nginx container on the same network)
#   • ONLYOFFICE Document Server is running at http://onlyoffice:80 (Docker)
#     or http://localhost:8180 (host port)
#   • Your admin panel is served at https://admin.amline.ir
#   • ONLYOFFICE will be proxied at https://office.amline.ir
#
# For SSL, configure certbot / Let's Encrypt separately.
# ─────────────────────────────────────────────────────────────────────────────

# ── ONLYOFFICE Document Server ───────────────────────────────────────────────
server {
    listen 80;
    server_name office.amline.ir;

    # Redirect HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name office.amline.ir;

    # SSL — replace with actual paths or use certbot
    ssl_certificate     /etc/letsencrypt/live/office.amline.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/office.amline.ir/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";

    # Required for ONLYOFFICE
    client_max_body_size 100m;

    location / {
        proxy_pass         http://localhost:8180;  # or http://onlyoffice:80 if using Docker network
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# ── Optional: proxy /onlyoffice path under the main admin domain ─────────────
